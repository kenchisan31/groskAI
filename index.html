    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { box-sizing: border-box; }
        body {
            background-color: #021a17;
            background-image: radial-gradient(ellipse at 15% 0%, rgba(0,180,120,0.13) 0%, transparent 50%),
                              radial-gradient(ellipse at 85% 100%, rgba(0,100,160,0.08) 0%, transparent 50%);
            color: #e2f5f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        aside {
            background: linear-gradient(180deg, #031e1a 0%, #021510 100%);
            border-right: 1px solid rgba(0,200,140,0.12);
        }

        /* ── NAV LINKS ── */
        .nav-link { color: #6aaa94; transition: all 0.2s; border-right: 3px solid transparent; }
        .nav-link:hover { background: rgba(0,200,140,0.08) !important; color: #00e896; }
        .nav-link.active {
            background: rgba(0,200,140,0.12) !important;
            color: #00e896 !important;
            border-right: 3px solid #00e896 !important;
        }
        @media (max-width: 768px) {
            .nav-link.active { border-right: none !important; border-left: 3px solid #00e896 !important; }
        }

        /* ── HEADER ── */
        header {
            background: #021510 !important;
            border-bottom: 1px solid rgba(0,200,140,0.1) !important;
        }

        /* ── CONNECT BUTTON ── */
        #connectBtn {
            background: linear-gradient(135deg, #0d9f78, #0a6b52) !important;
            box-shadow: 0 0 16px rgba(0,200,140,0.3) !important;
            border: 1px solid rgba(0,220,140,0.3) !important;
            transition: all 0.2s !important;
        }
        #connectBtn:hover {
            background: linear-gradient(135deg, #10b887, #0d8a6a) !important;
            box-shadow: 0 0 24px rgba(0,220,140,0.5) !important;
            transform: translateY(-1px);
        }

        iframe { width: 100%; height: calc(100vh - 80px); border: none; }

        /* ── MOBILE MENU ── */
        #mobileMenuOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 21, 16, 0.98);
            z-index: 100;
            flex-direction: column;
            padding: 2rem;
            border-right: 1px solid rgba(0,200,140,0.15);
        }
        #mobileMenuOverlay.active { display: flex; }

        /* ── WALLET MODAL ── */
        .wallet-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(2, 16, 14, 0.92);
            justify-content: center;
            align-items: center;
        }
        .wallet-modal.active { display: flex; }
        .wallet-modal-content {
            background: linear-gradient(145deg, #031e1a, #042a22);
            padding: 28px 22px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            color: white;
            text-align: center;
            position: relative;
            border: 1px solid rgba(0,200,140,0.25);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0,180,120,0.1);
        }
        .close-modal { position: absolute; right: 18px; top: 12px; font-size: 26px; cursor: pointer; color: #4a9a7a; transition: color 0.2s; }
        .close-modal:hover { color: #00e896; }
        .wallet-options { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
        .wallet-btn {
            display: flex; align-items: center; gap: 15px;
            background: rgba(0,200,140,0.07);
            color: #e2f5f0;
            border: 1px solid rgba(0,200,140,0.18);
            padding: 14px 18px; border-radius: 14px; cursor: pointer;
            font-size: 15px; font-weight: 600; width: 100%;
            transition: all 0.2s ease; text-align: left;
        }
        .wallet-btn:hover { background: rgba(0,200,140,0.18); border-color: rgba(0,220,140,0.5); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,200,140,0.15); }
        .wallet-btn img { width: 32px; height: 32px; object-fit: contain; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #021a17; }
        ::-webkit-scrollbar-thumb { background: #0d9f78; border-radius: 4px; }
    </style>
</head>

    <script>
        // Khai báo biến toàn cục
        let currentAccount = null;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let activeEthereumProvider = null;
        const PAYMENT_RECIPIENT_WALLET = '0xE2AD2594367C576931223A9B5aF99Cee38bcAfdD';
        const PAYMENT_NETWORKS = {
            '0x38': { chainId: '0x38', chainName: 'BNB Smart Chain Mainnet', rpcUrls: ['https://bsc.publicnode.com', 'https://rpc.ankr.com/bsc'], nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 }, blockExplorerUrls: ['https://bscscan.com/'] },
            '0x1': { chainId: '0x1', chainName: 'Ethereum Mainnet', rpcUrls: ['https://eth.llamarpc.com', 'https://rpc.ankr.com/eth'], nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 }, blockExplorerUrls: ['https://etherscan.io/'] }
        };
        
        // Supabase config (Đã sửa lỗi xung đột định danh)
        const SUPABASE_URL = 'https://ihuglkphzdhagzaomksg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlodWdsa3BoemRoYWd6YW9ta3NnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxOTg5MjIsImV4cCI6MjA5NDc3NDkyMn0.jepUTXPclTckTiyi7Jr7rT2rnrcyPshboOlDHbvdwFQ';
        let sb = null;
        
        if (window.supabase) {
            sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.warn("Supabase library not loaded");
        }

        async function saveUserToDB(walletAddress) {
            if (!sb || !walletAddress) return;
            const walletLower = walletAddress.toLowerCase();
            console.log("🔌 Checking and saving the wallet address to Supabase.:", walletLower);
            
            const { error } = await sb
                .from('users')
                .upsert([{ wallet_address: walletLower }], { onConflict: 'wallet_address' });

            if (error) {
                console.error("❌ Error saving wallet to Supabase:", error.message);
            } else {
                console.log("✅ Wallet synchronized with Supabase successfully!");
            }
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenuOverlay').classList.toggle('active');
        }

        function changePage(page, btn) {
            const frame = document.getElementById('mainFrame');
            const title = document.getElementById('pageTitle');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            if(btn) btn.classList.add('active');
            if(page === 'whitepaper') {
                frame.src = 'Doc.html';
                title.innerText = 'Whitepaper';
            } else if(page === 'aichat') {
                frame.src = 'Chat.html';
                title.innerText = 'Grosk AI Chat';
            } else if(page === 'withdraw') {
                frame.src = 'Windraw.html';
                title.innerText = 'Windraw';
            } else {
                frame.src = 'Dashboard.html';
                title.innerText = 'Dashboard';
            }
            if(document.getElementById('mobileMenuOverlay').classList.contains('active')) toggleMobileMenu();
        }

        function broadcastWalletToIframe(address) {
            const mainFrame = document.getElementById('mainFrame');
            if (mainFrame && mainFrame.contentWindow) {
                mainFrame.contentWindow.postMessage({ type: 'WALLET_CONNECTED', address: address }, '*');
                console.log("[Web.html] Wallet address synchronized with Iframe:", address);
            }
        }

        document.getElementById('mainFrame').addEventListener('load', function() {
            if (currentAccount) broadcastWalletToIframe(currentAccount);
        });
        
        function mapLevelToName(levelInt) {
            const map = { 1: 'SEEDS', 2: 'ALIGNED', 3: 'BUILDER', 4: 'WHALES' };
            return map[levelInt] || 'SEEDS';
            }

        function openWalletModal() {
            const title = document.getElementById('walletModalTitle');
            const desc = document.getElementById('walletModalDesc');
            if (isMobile && !window.ethereum) {
                title.innerText = 'Open in wallet';
                desc.innerText = 'Select a wallet to open this page in the app';
            } else {
                title.innerText = 'Connect your wallet';
                desc.innerText = 'Select a wallet to get started';
            }
            document.getElementById('walletModal').classList.add('active');
        }

        function closeWalletModal() {
            document.getElementById('walletModal').classList.remove('active');
        }

        // Bấm nút Connect Wallet trên Header sẽ kích hoạt mở Modal chọn ví
        window.handleConnectClick = async function () {
            openWalletModal();
        };

        async function handleWalletSelection(walletType) {
            closeWalletModal();
            if (isMobile && !window.ethereum) {
                openInWallet(walletType);
            } else {
                await connectWallet(walletType);
            }
        }

        function getInjectedProvider(walletType) {
            if (!window.ethereum) return null;
            const providers = window.ethereum.providers || [window.ethereum];
            if (walletType === 'metamask') return providers.find(p => p.isMetaMask) || window.ethereum;
            if (walletType === 'trustwallet') return providers.find(p => p.isTrust || p.isTrustWallet) || window.ethereum;
            if (walletType === 'binance') return providers.find(p => p.isBinance || p.isBinanceWallet) || window.ethereum;
            return window.ethereum;
        }

        function getActiveEthereumProvider() {
            return activeEthereumProvider || getInjectedProvider('metamask') || window.ethereum;
        }

        async function switchPaymentNetwork(eth, targetChainIdHex) {
            if (!targetChainIdHex) return;
            try {
                const currentChain = await eth.request({ method: 'eth_chainId' });
                // Đã đúng network rồi → không cần switch
                if (currentChain?.toLowerCase() === targetChainIdHex.toLowerCase()) return;
                await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: targetChainIdHex }] });
                // Chờ MetaMask hoàn tất switch trước khi tiếp tục
                await new Promise(r => setTimeout(r, 1000));
            } catch (switchError) {
                if (switchError.code === 4902 && PAYMENT_NETWORKS[targetChainIdHex]) {
                    await eth.request({ method: 'wallet_addEthereumChain', params: [PAYMENT_NETWORKS[targetChainIdHex]] });
                    await new Promise(r => setTimeout(r, 1000));
                    return;
                }
                // Code 4001 = user từ chối switch → throw để hiện thông báo
                throw switchError;
            }
        }

        async function connectWallet(walletType) {
            if (typeof window.ethereum === 'undefined') {
                alert('No cryptocurrency wallet found. Please install MetaMask or Trust Wallet.');
                return;
            }
            try {
                const selectedProvider = getInjectedProvider(walletType);
                activeEthereumProvider = selectedProvider;
                const accounts = await selectedProvider.request({ method: 'eth_requestAccounts' });
                if (accounts.length > 0) {
                    currentAccount = accounts[0];
                    updateUIAfterConnect(currentAccount);
                    broadcastWalletToIframe(currentAccount);
                    await saveUserToDB(currentAccount);
                }
            } catch (err) {
                console.error(err);
                if (err.code === 4001) alert('You have rejected the wallet connection.');
                else alert('An error occurred while connecting the wallet.');
            }
        }

        function openInWallet(walletType) {
            const currentUrl = window.location.href;
            let deepLink = '';
            switch(walletType) {
                case 'metamask':
                    deepLink = `https://metamask.app.link/dapp/${encodeURIComponent(currentUrl)}`;
                    break;
                case 'trustwallet':
                    deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${encodeURIComponent(currentUrl)}`;
                    break;
                case 'binance':
                    deepLink = `https://bsc-wallet.page.link/?link=${encodeURIComponent(currentUrl)}&apn=com.binance.wallet&ibi=com.binance.wallet`;
                    break;
                default: return;
            }
            window.location.href = deepLink;
        }

        function updateUIAfterConnect(address) {
            if (!address) return;
            const shortAddr = address.substring(0,6) + "..." + address.substring(address.length-4);
            const btnText = document.getElementById('btnText');
            const connectBtn = document.getElementById('connectBtn');
            if (btnText) btnText.innerText = shortAddr;
            if (connectBtn) {
                connectBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                connectBtn.classList.add('bg-green-600', 'hover:bg-green-700');
            }
            const mobileAddr = document.getElementById('mobileWalletAddr');
            if (mobileAddr) mobileAddr.innerText = shortAddr;
        }

        async function readPaymentBalance({ currency, contract, decimals, expectedChainIdHex }) {
            const eth = getActiveEthereumProvider();
            if (!eth) throw new Error('No wallet provider found. Please connect wallet first.');

            const accounts = await eth.request({ method: 'eth_accounts' });
            if (!accounts || accounts.length === 0) throw new Error('Wallet is not connected.');

            const currentChainIdHex = await eth.request({ method: 'eth_chainId' });
            if (expectedChainIdHex && currentChainIdHex.toLowerCase() !== expectedChainIdHex.toLowerCase()) {
                return {
                    address: accounts[0],
                    balance: null,
                    currentChainIdHex,
                    expectedChainIdHex,
                    needsNetworkSwitch: true
                };
            }

            const provider = new ethers.providers.Web3Provider(eth, 'any');
            let rawBalance;
            if (currency === 'BNB' || currency === 'ETH') {
                rawBalance = await provider.getBalance(accounts[0]);
                return {
                    address: accounts[0],
                    balance: ethers.utils.formatEther(rawBalance),
                    currentChainIdHex,
                    expectedChainIdHex,
                    needsNetworkSwitch: false
                };
            }

            if (!contract) throw new Error('Missing token contract address.');
            const erc20Abi = ['function balanceOf(address account) view returns (uint256)'];
            const tokenContract = new ethers.Contract(contract, erc20Abi, provider);
            rawBalance = await tokenContract.balanceOf(accounts[0]);
            return {
                address: accounts[0],
                balance: ethers.utils.formatUnits(rawBalance, Number(decimals || 18)),
                currentChainIdHex,
                expectedChainIdHex,
                needsNetworkSwitch: false
            };
        }
        // Lắng nghe tín hiệu yêu cầu đổi mạng từ Iframe gửi lên
window.addEventListener("message", async (event) => {
    if (event.data?.type !== 'REQUEST_TRANSACTION') return;

    const mainFrame = document.getElementById('mainFrame');
    if (mainFrame && event.source !== mainFrame.contentWindow) return;

    const { requestId, usdAmount, currency, contract, decimals, tokenAmount, expectedChainIdHex } = event.data;
    const respond = (payload) => {
        if (event.source) event.source.postMessage({ ...payload, requestId }, '*');
    };

    try {
        const eth = getActiveEthereumProvider();
        if (!eth) throw new Error('No wallet provider found. Please connect MetaMask first.');

        let accounts = await eth.request({ method: 'eth_accounts' });
        if (!accounts || accounts.length === 0) {
            accounts = await eth.request({ method: 'eth_requestAccounts' });
        }
        if (!accounts || accounts.length === 0) throw new Error('Wallet is not connected.');

        if (expectedChainIdHex) await switchPaymentNetwork(eth, expectedChainIdHex);

        // Chờ provider đồng bộ sau khi switch network
        const provider = new ethers.providers.Web3Provider(eth, 'any');
        await provider.ready;
        const signer = provider.getSigner();
        const walletAddress = await signer.getAddress();
        const amountString = String(tokenAmount || usdAmount);
        let tx;

        if (currency === 'BNB' || currency === 'ETH') {
            const value = ethers.utils.parseEther(amountString);
            // Kiểm tra balance — bỏ qua nếu RPC lỗi, MetaMask sẽ từ chối nếu không đủ
            try {
                const balance = await signer.getBalance();
                if (balance.lt(value)) {
                    throw new Error(`Insufficient ${currency} balance. Need ${amountString} ${currency}.`);
                }
            } catch (balErr) {
                if (balErr.message?.includes('Insufficient')) throw balErr;
                console.warn('Balance check skipped:', balErr.message);
            }
            tx = await signer.sendTransaction({ to: PAYMENT_RECIPIENT_WALLET, value });
        } else {
            if (!contract) throw new Error('Missing token contract address.');
            const erc20Abi = [
                'function balanceOf(address account) view returns (uint256)',
                'function transfer(address to, uint256 amount) returns (bool)'
            ];
            const tokenContract = new ethers.Contract(contract, erc20Abi, signer);
            const amount = ethers.utils.parseUnits(amountString, Number(decimals || 18));
            // Kiểm tra balance — bỏ qua nếu RPC lỗi (tránh CALL_EXCEPTION block giao dịch)
            try {
                const balance = await tokenContract.balanceOf(walletAddress);
                if (balance.lt(amount)) {
                    throw new Error(`Insufficient ${currency} balance. Need ${amountString} ${currency}.`);
                }
            } catch (balErr) {
                if (balErr.message?.includes('Insufficient')) throw balErr;
                console.warn('Balance check skipped:', balErr.message);
            }
            tx = await tokenContract.transfer(PAYMENT_RECIPIENT_WALLET, amount);
        }

        respond({ type: 'TRANSACTION_SUBMITTED', txHash: tx.hash, walletAddress });
        await tx.wait();
        currentAccount = walletAddress;
        updateUIAfterConnect(walletAddress);
        broadcastWalletToIframe(walletAddress);
        await saveUserToDB(walletAddress);
        respond({ type: 'TRANSACTION_SUCCESS', txHash: tx.hash, walletAddress });
    } catch (err) {
        console.error('Payment request failed:', err);
        const message = err?.reason || err?.data?.message || err?.message || 'Transaction failed.';
        respond({ type: 'TRANSACTION_FAILED', error: message });
    }
});
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', async function(accounts) {
                if (accounts.length > 0) {
                    currentAccount = accounts[0];
                    updateUIAfterConnect(currentAccount);
                    broadcastWalletToIframe(currentAccount);
                    await saveUserToDB(currentAccount);
                } else {
                    currentAccount = null;
                    const btnText = document.getElementById('btnText');
                    const connectBtn = document.getElementById('connectBtn');
                    if (btnText) btnText.innerText = "Connect Wallet";
                    if (connectBtn) {
                        connectBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                        connectBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    }
                    const mobileAddr = document.getElementById('mobileWalletAddr');
                    if (mobileAddr) mobileAddr.innerText = "Not Connected";
                    broadcastWalletToIframe('');
                }
            });
        }
    </script>
</body>
</html>
